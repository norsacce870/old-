version: '3.8'

services:

  # --- BASE DE DONNÉES MYSQL ---
  database:
    image: mysql:8.0
    container_name: old_baobab_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: baobab_cinema
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: baobab_user
      MYSQL_PASSWORD: baobab_pass
    ports:
      - "3307:3306"                    # ← Garde 3307 pour éviter conflit
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - baobab_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- ADMINISTRATION DE LA BDD (dev uniquement) ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: old_baobab_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - database
    networks:
      - baobab_network

  # --- BACKEND LARAVEL ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile               # ← OK (identique)
    container_name: old_baobab_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      DB_HOST: database
      DB_DATABASE: baobab_cinema
      DB_USERNAME: baobab_user
      DB_PASSWORD: baobab_pass
    depends_on:
      database:
        condition: service_healthy
    networks:
      - baobab_network

  # --- FRONTEND REACT ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile              # ← MODIFIÉ (Dockerfile.dev → Dockerfile)
    container_name: old_baobab_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - baobab_network

  # --- NGINX (reverse proxy principal) ---
  nginx:
    image: nginx:alpine
    container_name: old_baobab_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - baobab_network

networks:
  baobab_network:
    name: old_baobab_network
    driver: bridge

volumes:
  db_data:
    name: old_db_data
  backend_vendor:
    name: old_backend_vendor
  frontend_node_modules:
    name: old_frontend_node_modules